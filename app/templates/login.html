<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 · Linux 安全中心</title>
    <style>
        :root[data-theme="dark"] {
            --bg: #0a0e17; --card: #131826; --border: #1e2a3e;
            --text: #e0e6ed; --text-dim: #6b7a8f;
            --accent: #00d4ff; --green: #00e676;
            --yellow: #ffab00; --red: #ff3d4e;
            --navbar-bg: linear-gradient(135deg, #0d1520 0%, #131826 100%);
            --input-bg: #0d1117;
        }
        :root[data-theme="light"] {
            --bg: #f0f2f5; --card: #ffffff; --border: #dce1e8;
            --text: #1a202c; --text-dim: #6b7280;
            --accent: #0066cc; --green: #00875a;
            --yellow: #b88600; --red: #d1242f;
            --navbar-bg: linear-gradient(135deg, #ffffff 0%, #f5f7fa 100%);
            --input-bg: #f5f7fa;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0,0,0,.3);
        }
        .login-logo {
            text-align: center;
            margin-bottom: 28px;
        }
        .login-logo .icon { font-size: 42px; }
        .login-logo h1 {
            font-size: 22px; margin-top: 8px;
            color: var(--accent);
        }
        .login-logo .sub {
            font-size: 13px; color: var(--text-dim); margin-top: 4px;
        }
        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block; font-size: 13px;
            color: var(--text-dim); margin-bottom: 6px;
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--input-bg);
            color: var(--text);
            font-size: 15px;
            outline: none;
            transition: border-color .2s;
        }
        .form-group input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(0,212,255,.1);
        }
        .form-group input::placeholder { color: var(--text-dim); }
        .btn-login {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: var(--accent);
            color: var(--bg);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity .2s;
        }
        .btn-login:hover { opacity: .85; }
        .error-msg {
            background: rgba(255,61,78,.1);
            border: 1px solid var(--red);
            color: var(--red);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
            text-align: center;
        }
        .success-msg {
            background: rgba(0,230,118,.1);
            border: 1px solid var(--green);
            color: var(--green);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
            text-align: center;
        }
        .step-label {
            text-align: center;
            color: var(--text-dim);
            font-size: 13px;
            margin-bottom: 20px;
        }
        .step-label .badge-step {
            display: inline-block;
            background: var(--accent);
            color: var(--bg);
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-right: 6px;
        }
        .theme-toggle {
            position: fixed;
            top: 20px; right: 20px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 50%;
            width: 42px; height: 42px;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: border-color .2s;
        }
        .theme-toggle:hover { border-color: var(--accent); }
        .back-link {
            text-align: center;
            margin-top: 20px;
        }
        .back-link a {
            color: var(--text-dim);
            font-size: 13px;
            text-decoration: none;
        }
        .back-link a:hover { color: var(--accent); }
    </style>
</head>
<body>
    <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">🌙</button>
    <div class="login-card">
        <div class="login-logo">
            <div class="icon">🛡️</div>
            <h1>Linux 安全中心</h1>
            <div class="sub">请登录以继续</div>
        </div>

        {% if error %}
        <div class="error-msg">{{ error }}</div>
        {% endif %}
        {% if success %}
        <div class="success-msg">{{ success }}</div>
        {% endif %}

        {% if need_2fa %}
        <!-- Step 2: 2FA 验证码 -->
        <div class="step-label">
            <span class="badge-step">步骤 2</span>二步验证
        </div>
        <form method="POST" action="{{ url_for('main.login') }}">
            <input type="hidden" name="step" value="2">
            <div class="form-group">
                <label>输入验证器App上的6位验证码</label>
                <input type="text" name="code" placeholder="123456"
                       maxlength="6" pattern="\d{6}" required
                       style="text-align:center; font-size:24px; letter-spacing:8px;"
                       autocomplete="one-time-code" autofocus>
            </div>
            <button type="submit" class="btn-login">验证</button>
        </form>
        <div class="back-link">
            <a href="{{ url_for('main.login') }}">← 返回密码登录</a>
        </div>

        {% else %}
        <!-- Step 1: 用户名密码 -->
        <div class="step-label">
            <span class="badge-step">步骤 1</span>账号登录
        </div>
        <form method="POST" action="{{ url_for('main.login') }}">
            <input type="hidden" name="step" value="1">
            <input type="hidden" name="next" value="{{ next_url }}">
            <div class="form-group">
                <label>用户名</label>
                <input type="text" name="username" placeholder="admin"
                       required autofocus>
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" name="password" placeholder="••••••••"
                       required>
            </div>
            <button type="submit" class="btn-login">登录</button>
        </form>
        {% endif %}
    </div>

    <div style="text-align:center; padding:16px; color:var(--text-dim); font-size:12px;">
        <a href="https://github.com/yyzq-cf/linux-security-center" target="_blank" style="color: var(--accent); text-decoration: none;">GitHub</a>
    </div>

    <script>
    function toggleTheme() {
        const html = document.documentElement;
        const current = html.getAttribute('data-theme') || 'dark';
        const next = current === 'dark' ? 'light' : 'dark';
        html.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
        document.getElementById('themeBtn').textContent = next === 'dark' ? '🌙' : '☀️';
    }
    // 加载保存的主题
    (function() {
        const saved = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', saved);
        document.getElementById('themeBtn').textContent = saved === 'dark' ? '🌙' : '☀️';
    })();
    </script>
</body>
</html>
